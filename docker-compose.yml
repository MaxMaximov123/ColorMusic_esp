services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smarthome}
      POSTGRES_USER: ${DB_USER:-smarthome}
      POSTGRES_PASSWORD: ${DB_PASS:-smarthome}
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=64MB
      -c max_connections=20
      -c wal_buffers=1MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M

  app:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      - postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

volumes:
  pgdata:
