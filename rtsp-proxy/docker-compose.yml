services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wg-server
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./wg:/config/wg_confs
    ports:
      - "51820:51820/udp"
      - "8002:8002"
    restart: unless-stopped

  rtsp-proxy:
    build: .
    container_name: rtsp-proxy
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
    restart: unless-stopped
    environment:
      # камеры: имя=rtsp://url через запятую
      - "CAMERAS=cam1=rtsp://admin:61746723D@192.168.1.2:554/10"
      - JPEG_QUALITY=5
      - MAX_FPS=15
